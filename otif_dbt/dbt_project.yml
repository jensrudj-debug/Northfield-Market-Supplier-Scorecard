name: otif_dbt
version: "1.0.0"
config-version: 2

profile: otif_dbt

model-paths: ["models"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  otif_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

# OTIF definitions from docs/charter.md. Change thresholds here, never in SQL.
vars:
  run_date: "{{ env_var('RUN_DATE', '2026-10-25') }}"  # as-of date; replaces current_date everywhere
  on_time_days_early: 1             # On time: first receipt no more than 1 day before requested date
  on_time_days_late: 0              # On time: ... and no more than 0 days after
  in_full_threshold: 0.98           # In full: in-window cases >= 98% of ordered cases
  missed_after_days: 7              # Missed line: no receipt by requested date + 7 days
  provisional_days_after_week: 7    # Provisional: until 7 days after the attribution week ends
  over_shipment_threshold: 1.05     # Over-shipment: received above 105% of ordered
  receipt_lookback_days: 7          # fct_receipts incremental: reprocess partitions recorded this many days before the latest loaded
