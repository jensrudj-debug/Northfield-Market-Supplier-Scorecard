  - name: test_fulfillment_due_date_relative_to_run_date
    description: >
      Charter "Eligible line": a line is due once its requested date is on or
      before run_date. A line due tomorrow is not eligible even if it already
      arrived (1 day early); a line due today with no receipt yet is eligible and
      not on time.
    model: int_po_line_fulfillment
    overrides:
      vars: {run_date: "2026-10-25"}
    given:
      - input: ref('stg_po_lines')
        rows:
          - {po_line_id: DUE_TOMORROW_ARRIVED, po_number: P4, line_status: active, ordered_cases: 10}
          - {po_line_id: DUE_TODAY_NOTHING,    po_number: P5, line_status: active, ordered_cases: 10}
      - input: ref('stg_purchase_orders')
        rows:
          - {po_number: P4, supplier_id: S1, dc_id: DC01, requested_delivery_date: "2026-10-26"}
          - {po_number: P5, supplier_id: S1, dc_id: DC01, requested_delivery_date: "2026-10-25"}
      - input: ref('int_po_lines__receipt_rollup')
        rows:
          - {po_line_id: DUE_TOMORROW_ARRIVED, first_receipt_date: "2026-10-25", receipt_count: 1, cases_received_total: 10, cases_received_in_window: 10}
    expect:
      rows:
        - {po_line_id: DUE_TOMORROW_ARRIVED, is_eligible: false, is_on_time: true,  is_missed: false}
        - {po_line_id: DUE_TODAY_NOTHING,    is_eligible: true,  is_on_time: false, is_missed: false}

