# Synthetic raw-data generator settings (generator/generate.py).
# Every random draw comes from numpy default_rng(seed) and every date is derived
# from end_date, so the same config always produces byte-identical files.

seed: 20261025
end_date: "2026-10-25"   # data is "as of" this date; a Sunday, so the last ISO week is complete
months: 18               # history length ending at end_date

counts:
  suppliers: 60
  products: 1500

distribution_centers:
  - {dc_id: DC01, dc_name: Northfield DC, city: Northfield, state: MN, timezone: America/Chicago, volume_share: 0.6}
  - {dc_id: DC02, dc_name: Fargo DC, city: Fargo, state: ND, timezone: America/Chicago, volume_share: 0.4}

# Supplier category -> share of suppliers. Direct-store-delivery categories
# (bread, beverages, dairy) are out of scope per docs/charter.md.
categories:
  dry_grocery: 0.35
  frozen: 0.15
  refrigerated: 0.15
  produce: 0.12
  meat_seafood: 0.08
  household: 0.08
  health_beauty: 0.07

suppliers:
  lead_time_days: [2, 10]       # order date -> requested delivery date, inclusive range
  order_frequency_sigma: 0.5    # lognormal spread of how often a supplier gets POs

products:
  min_per_supplier: 5
  case_packs: [4, 6, 8, 12, 24]
  median_case_cost: 28.0

orders:
  pos_per_supplier_dc_week: 1.0 # Poisson mean before supplier, DC, and holiday multipliers
  receiving_days_per_week: 6    # requested delivery dates fall Mon-Sat
  order_slack_days: [0, 3]      # extra days added to lead time, inclusive range
  open_po_horizon_weeks: 2      # POs already placed for weeks after end_date (no receipts yet)
  mean_lines_per_po: 8
  median_ordered_cases: 12
  ordered_cases_sigma: 0.8
  holiday_case_multiplier: 1.3

cancellations:
  northfield_rate: 0.010        # excluded from OTIF eligibility
  supplier_rate: 0.015          # counted as OTIF failures
  max_days_before_due: 5

# Hidden ground truth: tiers are not written to suppliers.csv.
supplier_tiers:
  A: {share: 0.50, on_time: 0.96, in_full: 0.97}
  B: {share: 0.35, on_time: 0.88, in_full: 0.92}
  C: {share: 0.15, on_time: 0.75, in_full: 0.84}

delivery:
  one_day_early_share: 0.2      # of on-time first receipts, share arriving 1 day early
  miss_mix: {early: 0.15, late: 0.60, very_late: 0.10, never: 0.15}  # outcome when not on time
  max_early_days: 4             # "early" = 2..max days before requested date
  max_late_days: 7              # "late" = 1..max days after (still received, not a missed line)
  max_very_late_days: 14        # "very_late" = 8..max days after (a missed line that shows up later)
  split_rate: 0.04              # lines received in two receipts
  split_max_gap_days: 3
  first_hour: 5                 # receiving hours, DC local time
  last_hour: 21
  late_night_rate: 0.02         # receipts posted 23:00-23:59 (DC-local-date edge cases)
  rejection_rate: 0.02          # receipts with some cases rejected at the dock

quantities:
  short_fill_range: [0.50, 0.95]
  over_ship_rate: 0.01
  over_ship_range: [1.06, 1.20] # always above the 105% over-shipment flag

# One supplier that was reliable and degrades mid-history.
storyline:
  supplier_id: SUP017
  supplier_name: Prairie Harvest Foods
  baseline_tier: A
  degrade_from: "2026-06-01"    # by requested delivery date
  on_time: 0.68
  in_full: 0.80

holiday:
  volume_multiplier: 1.35
  on_time_penalty: 0.07

# Any date inside the week; the generator maps each to its ISO week (Monday start).
holiday_weeks:
  - "2025-05-26"   # Memorial Day
  - "2025-07-04"   # Independence Day
  - "2025-09-01"   # Labor Day
  - "2025-11-27"   # Thanksgiving
  - "2025-12-25"   # Christmas
  - "2026-01-01"   # New Year's Day
  - "2026-05-25"   # Memorial Day
  - "2026-07-04"   # Independence Day
  - "2026-09-07"   # Labor Day

# Injected issues, as a share of clean receipts. Each issue hits a disjoint set of rows.
data_quality:
  rates:
    late_posted_receipts: 0.020       # recorded_date 1..N days after the receipt date
    missing_received_at: 0.001
    nonstandard_received_at: 0.002    # MM/DD/YYYY HH:MM instead of ISO
    nonpositive_received_cases: 0.001 # 0 or a negative reversal
    sku_format_drift: 0.003           # lowercase or trailing space
    orphan_receipts: 0.002            # po_line_id that does not exist
    duplicate_receipts: 0.004         # exact duplicate rows in the same partition
  late_posting_max_days: 5
